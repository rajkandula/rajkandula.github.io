{%- comment -%}
Comments via giscus — stored as GitHub Discussions on this repository (Announcements
category, one discussion per page). Requires the giscus app: https://github.com/apps/giscus
{%- endcomment -%}
<section class="comments" id="comments">
  <h2>Comments</h2>
  <p class="comments__note">Sign in with GitHub to join the discussion.</p>
  <script src="https://giscus.app/client.js"
          data-repo="rajkandula/rajkandula.github.io"
          data-repo-id="R_kgDOJhTIEA"
          data-category="Announcements"
          data-category-id="DIC_kwDOJhTIEM4DFnUR"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="0"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async></script>
</section>
